name: Deploy AdvancedToDoList to GitHub Pages

env:
  PROJECT_PATH: ControlCatalog.Browser/ControlCatalog.Browser.csproj
  OUTPUT_PATH:  ControlCatalog.Browser/bin/Release/net10.0-browser/publish/wwwroot

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Grant the workflow's GITHUB_TOKEN write access to the repo contents.
# Without this the deploy step is denied with HTTP 403.
permissions:
  contents: write

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      - name: Publish .NET Project
        run: dotnet publish $PROJECT_PATH -c Release --nologo

      - name: copy index.html to 404.html
        run: cp $OUTPUT_PATH/index.html $OUTPUT_PATH/404.html

      - name: Add .nojekyll file
        run: touch $OUTPUT_PATH/.nojekyll

      - name: Commit wwwroot to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: ${{ env.OUTPUT_PATH }}
          single-commit: true